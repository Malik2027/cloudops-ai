[defaults]
inventory           = inventory/
roles_path          = roles/
remote_user         = ubuntu
private_key_file    = /home/mohammad/Pictures/HRMS.pem
host_key_checking   = False
retry_files_enabled = False
gathering           = smart
fact_caching        = memory
stdout_callback     = ansible.builtin.default
result_format       = yaml

[ssh_connection]
pipelining = True
ssh_args   = -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ap-south-1"
