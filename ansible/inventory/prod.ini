# Prod inventory
# Get real IPs after terraform apply:
#   terraform -chdir=terraform/environments/prod output instance_private_ips
[webservers]
web01 ansible_host=REPLACE_WITH_PROD_EC2_IP_1
web02 ansible_host=REPLACE_WITH_PROD_EC2_IP_2

[webservers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=../keys/HRMS.pem
environment=prod
